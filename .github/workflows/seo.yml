name: Páginas dos jogos (Google)
on:
  push:
    branches: [main]
    paths: ["games.js", "data/prices.json", "data/scenes.json", "scripts/seo-pages.mjs", ".github/workflows/seo.yml"]
  schedule:
    - cron: "53 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: seo-pages }
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/seo-pages.mjs
      - name: Salvar
        run: |
          git config user.name "Zera robô de páginas"
          git config user.email "robo@users.noreply.github.com"
          git add -A jogo sitemap.xml robots.txt data/seo-covers.json data/seo-slugs.json
          git diff --cached --quiet && exit 0
          git commit -m "Páginas dos jogos $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
