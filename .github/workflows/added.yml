name: Datas de entrada dos jogos
on:
  push:
    branches: [main]
    paths: ["games.js", "scripts/added-dates.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: added }
jobs:
  datas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/added-dates.mjs
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô de datas"
          git config user.email "robo@users.noreply.github.com"
          git add data/added.json
          git diff --cached --quiet && exit 0
          git commit -m "Datas de entrada dos jogos $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
