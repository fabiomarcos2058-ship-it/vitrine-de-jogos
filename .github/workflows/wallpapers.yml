name: Buscar artes de personagens
on:
  push:
    branches: [main]
    paths: ["scripts/wallpapers.py", "scripts/wallpapers-input.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: artes }
jobs:
  artes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow && python3 scripts/wallpapers.py
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô de artes"
          git config user.email "robo@users.noreply.github.com"
          git add data/wp-* chars/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Artes de personagens $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
