name: Sonda das lojas
on:
  push:
    branches: [main]
    paths: ["scripts/probe.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sonda }
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô sonda"
          git config user.email "robo@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Sonda das lojas $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
