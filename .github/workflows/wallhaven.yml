name: Wallpapers de personagens
on:
  push:
    branches: [main]
    paths: ["scripts/wallhaven.py", "scripts/wallhaven-input.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: wallhaven }
jobs:
  wall:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow && python3 scripts/wallhaven.py
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô de wallpapers"
          git config user.email "robo@users.noreply.github.com"
          git add data/wall* chars/
          git diff --cached --quiet && exit 0
          git commit -m "Wallpapers de personagens $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
