name: Artes de personagens com fundo
on:
  push:
    branches: [main]
    paths: ["scripts/compose.py", "scripts/compose-input.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: artes-fundo }
jobs:
  compor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lista de jogos
        run: node -e "global.window={};require('./games.js');require('fs').writeFileSync('/tmp/games.json',JSON.stringify(window.GAMES.map(g=>({id:g.id,t:g.t,img:g.img}))))"
      - run: pip install --quiet pillow && python3 scripts/compose.py
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô de artes"
          git config user.email "robo@users.noreply.github.com"
          git add -A data/wall* chars/
          git diff --cached --quiet && exit 0
          git commit -m "Artes de personagens com fundo $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
