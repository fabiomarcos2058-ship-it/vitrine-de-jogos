name: Prints das versões do site
on:
  push:
    branches: [prints-historia]
    paths: ["tools/shoot.js", ".github/workflows/prints.yml", "tools/versoes.txt"]
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/shoot.js $(cat tools/versoes.txt)
      - run: |
          git config user.name "Zera robô"; git config user.email "robo@users.noreply.github.com"
          git add shots && git commit -qm "Prints das versões" && git push -q
