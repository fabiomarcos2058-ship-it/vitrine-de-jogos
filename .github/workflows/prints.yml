name: Prints das versões do site
on:
  push:
    branches: [prints-historia]
    paths: ["tools/shoot.js", "tools/shoot2.js", ".github/workflows/prints.yml", "tools/versoes.txt"]
permissions:
  contents: write
jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: |
          if [ -f tools/so-atual ]; then node tools/shoot2.js; else node tools/shoot.js $(cat tools/versoes.txt); fi
          mkdir -p shots/fonts
          for f in "ofl/unbounded/Unbounded%5Bwght%5D.ttf" "ofl/onest/Onest%5Bwght%5D.ttf" "ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"; do curl -sSfL -o "shots/fonts/$(basename "$f" | sed 's/%5Bwght%5D//')" "https://raw.githubusercontent.com/google/fonts/main/$f" || true; done
      - run: |
          git config user.name "Zera robô"; git config user.email "robo@users.noreply.github.com"
          git add shots && git commit -qm "Prints das versões" && git push -q
