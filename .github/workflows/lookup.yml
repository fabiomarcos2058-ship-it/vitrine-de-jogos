name: Buscar dados de jogos
on:
  push:
    branches: [main]
    paths: ["scripts/lookup.mjs", "scripts/lookup-input.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: precos }
jobs:
  busca:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/lookup.mjs
      - name: Salvar resultado
        run: |
          git config user.name "Zera robô de busca"
          git config user.email "robo@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Dados de jogos coletados $(date -u +'%d/%m %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
